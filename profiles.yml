# ============================================================
# profiles.yml — Snowflake WIF (OIDC)
# Token set by setup-snowflake composite action in dbt-action_client repo
#
#   ci target   → database = AIRBNB, schema overridden by macro → CI_<github_username>
#   test target → database = TEST   (dedicated TEST database)
#   prod target → database = PROD   (dedicated PROD database)
# ============================================================
dbt_snowflake_wif_client:
  target: ci
  outputs:

    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: GITHUB_ACTIONS_SERVICE_USER
      authenticator: workload_identity
      workload_identity_provider: oidc
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
      role: DBT_CI_ROLE
      database: AIRBNB
      warehouse: COMPUTE_WH
      schema: CI                    # overridden by macro → CI_USERNAME
      threads: 4

    test:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: GITHUB_ACTIONS_SERVICE_USER
      authenticator: workload_identity
      workload_identity_provider: oidc
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
      role: DBT_TEST_ROLE
      database: TEST                # dedicated TEST database (folder routing → TEST.PREP/TEST.RPT)
      warehouse: COMPUTE_WH
      schema: PUBLIC                # base schema; models route to PREP/RPT via folders
      threads: 4

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'ixxaxho-kv48866') }}"
      user: GITHUB_ACTIONS_SERVICE_USER
      authenticator: workload_identity
      workload_identity_provider: oidc
      token: "{{ env_var('SNOWFLAKE_TOKEN', '') }}"
      role: DBT_PROD_ROLE
      database: PROD                # dedicated PROD database (folder routing → PROD.PREP/PROD.RPT)
      warehouse: COMPUTE_WH
      schema: PUBLIC                # base schema; models route to PREP/RPT via folders
      threads: 4
