name: 'dbt_snowflake_wif_client'
version: '1.0.0'
config-version: 2

profile: 'dbt_snowflake_wif_client'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_snowflake_wif_client:
    +materialized: view
    prep:
      +schema: PREP        # models/prep/ → PREP schema (folder-based routing)
    rpt:
      +schema: RPT         # models/rpt/  → RPT schema (folder-based routing)
