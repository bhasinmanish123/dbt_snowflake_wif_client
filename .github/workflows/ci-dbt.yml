# ============================================================
# CI — dbt (runs on Pull Request open/update, NOT on merge)
# → lint + dbt build in CI_<github_username> personal schema
# ============================================================
name: dbt CI (WIF)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: bhasinmanish123/dbt-action_client/.github/workflows/dbt-reusable.yml@main
    with:
      stage: ci
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
