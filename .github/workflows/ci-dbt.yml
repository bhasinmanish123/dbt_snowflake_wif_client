# ============================================================
# CI — dbt (runs on Pull Request open/update, NOT on merge)
# → lint + dbt build in CI_<github_username> personal schema
#
# concurrency: cancel outdated CI runs on the same PR (only test latest)
# ============================================================
name: dbt CI (WIF)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Cancel superseded CI runs on the same PR (only validate the latest push)
concurrency:
  group: data-transform-ci-dbt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: bhasinmanish123/dbt-action_client/.github/workflows/dbt-reusable.yml@main
    with:
      stage: ci
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
