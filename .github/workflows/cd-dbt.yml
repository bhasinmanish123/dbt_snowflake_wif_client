# ============================================================
# CD — dbt (runs ONLY when a PR is MERGED to main)
# Uses pull_request closed + merged==true (precise merge detection)
# → dbt build to PROD (and PREP/RPT deploy schemas)
# ============================================================
name: dbt CD (WIF)

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  cd:
    if: github.event.pull_request.merged == true
    uses: bhasinmanish123/dbt-action_client/.github/workflows/dbt-reusable.yml@main
    with:
      stage: cd
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
