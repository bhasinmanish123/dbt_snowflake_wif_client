# ============================================================
# CD — dbt (runs ONLY on push/merge to main)
# Calls reusable workflow with stage: cd
# → dbt build to PROD (and PREP/RPT deploy schemas)
# ============================================================
name: dbt CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  cd:
    uses: bhasinmanish123/dbt-action_client/.github/workflows/dbt-reusable.yml@main
    with:
      stage: cd
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
