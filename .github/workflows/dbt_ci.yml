# ============================================================
# dbt CI — runs ci.sh (composite action provides token only)
#
# Flow:
#   1. Lint (YAML + SQL)
#   2. setup-snowflake composite action → WIF OIDC token
#   3. Run ci.sh (dbt commands live in the script — per-repo customizable)
#   → builds in CI_<github_username> personal schema
# ============================================================
name: dbt CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: dbt CI → CI_${{ github.actor }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      DBT_PROFILES_DIR: .
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      DBT_TARGET: ci
    steps:
      - uses: actions/checkout@v4

      # ---- Lint ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect snowflake --ignore templating

      # ---- Token (composite action ONLY provides the WIF token) ----
      - name: Setup Snowflake (WIF token)
        uses: bhasinmanish123/dbt-action_client/.github/actions/setup-snowflake@main
        with:
          environment: ci
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      # ---- dbt via ci.sh (per-repo customizable script) ----
      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Run ci.sh
        run: chmod +x ci.sh && ./ci.sh
