# ============================================================
# dbt CD (PROD) — MANUAL trigger only
#
# PROD is a deliberate promotion, NOT automatic on merge.
# Trigger it from Actions → "dbt CD (PROD)" → Run workflow,
# or via CLI: gh workflow run "dbt CD (PROD)" --ref main
#
# Flow:
#   1. setup-snowflake composite action → WIF OIDC token
#   2. Run cd.sh → builds PROD (PREP/RPT/HIST deploy schemas)
#
# Decoupled: PROD never fires on merge. SIT auto-deploys on merge
# (dbt_deploy_sit.yml); you promote to PROD when ready.
# ============================================================
name: dbt CD (PROD)

on:
  workflow_dispatch:
    inputs:
      select:
        description: 'dbt --select (optional, e.g. state:modified+ or tag:nightly)'
        required: false
        default: ''

concurrency:
  group: dbt-cd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  cd:
    name: dbt CD → PROD
    runs-on: ubuntu-latest
    environment: prod
    env:
      DBT_PROFILES_DIR: .
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_EVENT_NAME: ''
      DBT_CI_RUN: 'false'
      DBT_TARGET: prod
      DBT_SELECT: ${{ github.event.inputs.select }}
    steps:
      - uses: actions/checkout@v4

      # ---- Token (composite action ONLY provides the WIF token) ----
      - name: Setup Snowflake (WIF token)
        uses: bhasinmanish123/dbt-action_client/.github/actions/setup-snowflake@main
        with:
          environment: prod
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      # ---- dbt via cd.sh (per-repo customizable script) ----
      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Run cd.sh
        run: chmod +x cd.sh && ./cd.sh
