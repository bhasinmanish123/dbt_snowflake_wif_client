# ============================================================
# dbt CD — runs cd.sh (composite action provides token only)
#
# Flow:
#   1. setup-snowflake composite action → WIF OIDC token
#   2. Run cd.sh (dbt commands live in the script — per-repo customizable)
#   → builds PROD (and PREP/RPT deploy schemas)
#
# Runs ONLY when a PR is merged to main.
# ============================================================
name: dbt CD

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: dbt-cd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  cd:
    if: github.event.pull_request.merged == true
    name: dbt CD → PROD
    runs-on: ubuntu-latest
    environment: prod
    env:
      DBT_PROFILES_DIR: .
      DBT_TARGET: prod
    steps:
      - uses: actions/checkout@v4

      # ---- Token (composite action ONLY provides the WIF token) ----
      - name: Setup Snowflake (WIF token)
        uses: bhasinmanish123/dbt-action_client/.github/actions/setup-snowflake@main
        with:
          environment: prod
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      # ---- dbt via cd.sh (per-repo customizable script) ----
      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Run cd.sh
        run: chmod +x cd.sh && ./cd.sh
