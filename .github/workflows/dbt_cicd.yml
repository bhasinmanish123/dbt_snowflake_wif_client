# ============================================================
# CALLER — dbt_snowflake_wif_client
# Calls the reusable workflow in dbt-action_client repo
#
# All CI/CD logic lives in dbt-action_client (central).
# This file just decides WHEN to run and passes secrets.
#
#   PR to main      → stage: ci  (lint + build CI_<username>)
#   push/merge main → stage: cd  (build PROD)
#
# SECRETS NEEDED (1 only):
#   SNOWFLAKE_ACCOUNT
# GITHUB ENVIRONMENT NEEDED:
#   prod
# ============================================================
name: dbt CI/CD (WIF)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    if: github.event_name == 'pull_request'
    uses: bhasinmanish123/dbt-action_client/.github/workflows/dbt-reusable.yml@main
    with:
      stage: ci
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}

  cd:
    if: github.event_name == 'push'
    uses: bhasinmanish123/dbt-action_client/.github/workflows/dbt-reusable.yml@main
    with:
      stage: cd
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
