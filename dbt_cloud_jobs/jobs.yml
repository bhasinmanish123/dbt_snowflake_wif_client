# ============================================================
# dbt Cloud job definitions
# On merge to main (when this folder changes), deploy-jobs.yml
# syncs these to dbt Cloud (create if missing, update if exists).
#
# Jobs connect to Snowflake via the dbt Cloud ENVIRONMENT (environment_id).
# ============================================================

# Real dbt Cloud IDs (from the dbt Cloud URLs)
project_id: 70506183166416          # dbt Cloud project
environment_id: 70506183156274      # environment (holds Snowflake connection)

jobs:

  daily_prod_build:
    name: "Daily Prod Build"
    execute_steps:
      - "dbt build --target prod"
    schedule:
      cron: "0 2 * * *"            # 2am daily
    triggers:
      schedule: true
      github_webhook: false

  hourly_reporting:
    name: "Hourly Reporting"
    execute_steps:
      - "dbt build --target prod --select tag:hourly"
    schedule:
      cron: "0 * * * *"            # every hour
    triggers:
      schedule: true
      github_webhook: false
