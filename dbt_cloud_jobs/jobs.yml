# ============================================================
# dbt Cloud job definitions — CREATE ONLY (no schedule)
#
# Jobs are CREATED in dbt Cloud but NOT scheduled.
# Triggered externally (by Airflow) via the dbt Cloud API:
#     POST /jobs/{job_id}/run/
#
# schedule_enabled: false → no cron, no auto-run.
# Jobs connect to Snowflake via the environment (environment_id).
# ============================================================

project_id: 70506183166416
environment_id: 70506183156532

jobs:

  prod_build:
    name: "Prod Build"
    execute_steps:
      - "dbt build --target prod"
    schedule_enabled: false

  reporting_build:
    name: "Reporting Build"
    execute_steps:
      - "dbt build --target prod --select tag:hourly"
    schedule_enabled: false
